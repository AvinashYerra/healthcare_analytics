services:

  postgres:
    image: postgres:16
    container_name: airflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - healthcare-network


  airflow-init:

    build:
      context: .

    image: healthcare-airflow

    container_name: airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      PYTHONPATH: /opt/project:/opt/project/src

    user: "${AIRFLOW_UID}:0"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/project

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Avinash
      --lastname Yerra
      --role Admin
      --email admin@example.com
      "

    networks:
      - healthcare-network


  airflow-webserver:

    image: healthcare-airflow

    container_name: airflow-webserver

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - .env

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      PYTHONPATH: /opt/project:/opt/project/src

    user: "${AIRFLOW_UID}:0"

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/project

    command: airflow webserver

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - healthcare-network


  airflow-scheduler:

    image: healthcare-airflow

    container_name: airflow-scheduler

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - .env

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      PYTHONPATH: /opt/project:/opt/project/src

    user: "${AIRFLOW_UID}:0"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/project

    command: airflow scheduler

    networks:
      - healthcare-network


  streamlit:

    build:
      context: .
      dockerfile: Dockerfile.streamlit

    image: healthcare-dashboard

    container_name: healthcare-dashboard

    restart: unless-stopped

    depends_on:
      airflow-webserver:
        condition: service_healthy

    working_dir: /app

    volumes:
      - .:/app

    environment:
      PYTHONPATH: /app/src

    ports:
      - "8501:8501"

    command: >
      streamlit run src/dashboard/app.py
      --server.address=0.0.0.0

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - healthcare-network


volumes:
  postgres-db-volume:


networks:
  healthcare-network:
    driver: bridge